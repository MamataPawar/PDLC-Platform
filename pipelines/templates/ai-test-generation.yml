# ── Template: AI Test Generation ────────────────────────────
# Triggered post-merge to main.
# Finds source files without test coverage, calls PDLC API,
# commits generated test stubs to tests/generated/ on a new branch,
# then opens a PR for human review.

parameters:
  - name: pdlcApiUrl
    type: string
  - name: adoOrg
    type: string
  - name: adoProject
    type: string
  - name: adoRepo
    type: string
  - name: adoPat
    type: string
  - name: backendPath
    type: string

jobs:
  - job: ai_test_generation
    displayName: 'Claude Test Generation'
    continueOnError: true   # Never breaks main pipeline flow
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: UseDotNet@2
        inputs:
          version: '9.0.x'

      - script: |
          # ── Find recently changed .cs files (last commit to main) ──
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD \
            -- '*.cs' \
            | grep -v "Tests\|\.Designer\|\.g\." \
            | head -5)   # cap at 5 files per run

          echo "Files to generate tests for:"
          echo "$CHANGED_FILES"
          echo "##vso[task.setvariable variable=CHANGED_FILES]$CHANGED_FILES"
        displayName: 'Find recently changed source files'

      - script: |
          # ── Generate tests via PDLC API for each changed file ──
          BRANCH="feat/ai-testgen-$(Build.BuildId)"
          echo "##vso[task.setvariable variable=TEST_BRANCH]$BRANCH"

          echo "$CHANGED_FILES" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "Generating tests for: $FILE"

            FILE_CONTENT=$(cat "$FILE" 2>/dev/null || echo "")
            [ -z "$FILE_CONTENT" ] && continue

            # Call PDLC API
            RESPONSE=$(curl --silent --fail \
              --max-time 180 \
              -X POST "${{ parameters.pdlcApiUrl }}/api/pdlc/testgen/generate" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
          import json, sys
          content = open('$FILE').read()
          payload = {
              'sourceContent': content[:8000],
              'sourceFileName': '$FILE',
              'target': 0,
              'createdBy': 'pipeline-stage4'
          }
          print(json.dumps(payload))
          ")")

            RESULT_ID=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Get the requirementDocumentId if present
          if isinstance(data, list) and data:
              print(data[0].get('id', ''))
          ")

            echo "Generated test result: $RESULT_ID"
          done
        displayName: 'Generate test stubs via Claude'
        env:
          CHANGED_FILES: $(CHANGED_FILES)

      - script: |
          # ── Commit generated tests to new branch ──
          BRANCH="feat/ai-testgen-$(Build.BuildId)"

          git config user.email "pdlc-pipeline@noreply.dev.azure.com"
          git config user.name  "PDLC AI Pipeline"

          git checkout -b "$BRANCH"

          # Download and write generated files from PDLC API
          # (In practice, the CommitToAdo endpoint does this server-side)
          # This step confirms the branch exists for the PR creation below

          git push origin "$BRANCH" --force-with-lease || true
          echo "##vso[task.setvariable variable=TEST_BRANCH]$BRANCH"
        displayName: 'Push test generation branch'

      - script: |
          # ── Open a PR for the generated test stubs ──
          PR_RESPONSE=$(curl --silent \
            -X POST \
            "https://dev.azure.com/${{ parameters.adoOrg }}/${{ parameters.adoProject }}/_apis/git/repositories/${{ parameters.adoRepo }}/pullrequests?api-version=7.1" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $(echo -n :${{ parameters.adoPat }} | base64)" \
            -d '{
              "title": "🤖 AI-Generated Test Stubs [Build $(Build.BuildId)]",
              "description": "## AI-Generated Test Stubs\n\nGenerated by PDLC Stage 4 (Claude claude-sonnet-4-6) post-merge to main.\n\n**Review checklist:**\n- [ ] Tests compile without errors\n- [ ] Test names reflect intended behaviour\n- [ ] Mock setups are correct\n- [ ] Remove any generated tests that duplicate existing coverage\n\n> This PR was opened automatically. Always review before merging.",
              "sourceRefName": "refs/heads/$(TEST_BRANCH)",
              "targetRefName": "refs/heads/main",
              "isDraft": true,
              "labels": [{"name": "ai-generated"}, {"name": "test-stubs"}]
            }')

          PR_ID=$(echo "$PR_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('pullRequestId','unknown'))")
          echo "Opened draft PR #$PR_ID for AI-generated tests"
          echo "##vso[task.setvariable variable=TEST_PR_ID]$PR_ID"
        displayName: 'Open draft PR for test stubs'
        condition: succeeded()

      - script: |
          echo "✅ AI Test Generation complete"
          echo "   Branch: $(TEST_BRANCH)"
          echo "   Draft PR: #$(TEST_PR_ID)"
          echo "   Review at: https://dev.azure.com/${{ parameters.adoOrg }}/${{ parameters.adoProject }}/_git/${{ parameters.adoRepo }}/pullrequest/$(TEST_PR_ID)"
        displayName: 'Summary'
        condition: always()
